<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172027" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="점심반장">
<title>서부 점심반장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: 왼쪽 결정 패널(오늘·식당·설정) + 오른쪽 내장 지도. 900px 미만은 탭으로 전환. */
:root{
  --ground:#EEF1EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#1B2530; --ink-2:#465360; --ink-3:#6F7B85;
  --line:#D9DFD8; --line-2:#C5CEC4;
  --seal:#BF3A2B; --seal-ink:#FFFFFF; --seal-text:#B23526; --seal-soft:#F8E4E0;
  --go:#2D7653; --rest:#98A2A8; --warn:#9A5F0C; --warn-soft:#FBF0DC; --focus:#2F6FB0;
  --m-ground:#ECEEE8; --m-green:#D5E5CA; --m-park:#C9E2BD; --m-water:#B5D4E8; --m-road:#FFFFFF; --m-casing:#C9D0C8;
  --m-major:#F6E19C; --m-major-casing:#D2B263; --m-rail:#8A949B; --m-label:#36414B; --m-halo:rgba(255,255,255,.92);
  --pin-bg:#FFFFFF; --pin-ink:#1B2530;
  --f-display:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-seal:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --shadow:0 1px 2px rgba(27,37,48,.06),0 6px 20px rgba(27,37,48,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10161A; --surface:#172027; --surface-2:#1C262D; --ink:#E5EBEE; --ink-2:#B2BDC4; --ink-3:#8D9AA4;
    --line:#2A343C; --line-2:#3A4650;
    --seal:#C4483A; --seal-ink:#FFFFFF; --seal-text:#F08372; --seal-soft:#3A201C;
    --go:#62C08F; --rest:#5F6A72; --warn:#E3AA4F; --warn-soft:#352A16; --focus:#7FB0E6;
    --m-ground:#151C21; --m-green:#1A2A20; --m-park:#1C3124; --m-water:#1D3A4E; --m-road:#2B353C; --m-casing:#1D252B;
    --m-major:#5B5032; --m-major-casing:#3D3721; --m-rail:#5A656D; --m-label:#C8D2D9; --m-halo:rgba(21,28,33,.9);
    --pin-bg:#1F2930; --pin-ink:#E5EBEE;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#10161A; --surface:#172027; --surface-2:#1C262D; --ink:#E5EBEE; --ink-2:#B2BDC4; --ink-3:#8D9AA4;
  --line:#2A343C; --line-2:#3A4650;
  --seal:#C4483A; --seal-ink:#FFFFFF; --seal-text:#F08372; --seal-soft:#3A201C;
  --go:#62C08F; --rest:#5F6A72; --warn:#E3AA4F; --warn-soft:#352A16; --focus:#7FB0E6;
  --m-ground:#151C21; --m-green:#1A2A20; --m-park:#1C3124; --m-water:#1D3A4E; --m-road:#2B353C; --m-casing:#1D252B;
  --m-major:#5B5032; --m-major-casing:#3D3721; --m-rail:#5A656D; --m-label:#C8D2D9; --m-halo:rgba(21,28,33,.9);
  --pin-bg:#1F2930; --pin-ink:#E5EBEE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
p{margin:0}

.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:34px;height:34px;border-radius:8px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font:800 17px/1 var(--f-seal);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.brand-name{font:400 21px/1.1 var(--f-display)}
.brand-sub{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tabs{margin-left:auto;display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr)}
.panel{min-height:0;overflow-y:auto;border-right:1px solid var(--line)}
.view{padding:18px 20px 48px;display:flex;flex-direction:column;gap:20px}
.mapwrap{position:relative;min-height:0;min-width:0;background:var(--m-ground);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map:active{cursor:grabbing}
#map.placing{cursor:crosshair}
.only-narrow{display:none!important}
@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{border-right:0}
  .app[data-tab="map"] .panel{display:none}
  .app:not([data-tab="map"]) .mapwrap{display:none}
  .only-narrow{display:inline-flex!important}
  .top{padding:8px 16px;gap:8px 12px;flex-wrap:wrap}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1;padding:7px 6px}
  .view{padding:14px 16px 40px}
}

/* 공통 부품 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.seal{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.seal:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--seal-text)}
.link{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.link.plain{text-decoration:none;color:var(--ink);font-size:inherit;text-align:left}
.link.plain:hover{text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:14px;font-weight:700}
.sec-h span{font-size:12px;color:var(--ink-3)}
.glyph{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--pin-ink);font:400 14px/1 var(--f-display);color:var(--pin-ink);background:var(--pin-bg)}
.badge{display:inline-block;font-size:11px;font-weight:600;line-height:1.6;padding:0 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.ok{color:var(--go);border-color:currentColor}
.badge.off{color:var(--ink-3);border-style:dashed}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--line)}
.notice p{font-size:13px;flex:1 1 220px}

/* 오늘의 점심 표(식권) */
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.count{font-size:13px;color:var(--ink-2);white-space:nowrap}
.count b{font:400 28px/1 var(--f-display);color:var(--ink);margin:0 3px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{cursor:default}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.t-top{position:relative;padding:18px 20px 16px}
.t-eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.t-cat{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-2);font-weight:500;padding-right:84px}
.t-name{margin:6px 0 0;font:400 36px/1.12 var(--f-display);text-wrap:balance;padding-right:84px;overflow-wrap:anywhere}
.t-meta{margin-top:8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.t-meta b{color:var(--warn);font-weight:600}
.t-note{margin-top:10px;font-size:12.5px;color:var(--warn)}
.reasons{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.reasons li{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.t-perf{position:relative;border-top:1.5px dashed var(--line-2);margin:0 14px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--ground);border:1px solid var(--line)}
.t-perf::before{left:-25px}.t-perf::after{right:-25px}
.t-actions{display:flex;gap:8px;padding:14px 20px 12px;align-items:center}
.t-actions .btn{flex:1}
.t-actions.done{justify-content:space-between;font-size:13px;color:var(--ink-2);padding-bottom:16px}
.t-alt{padding:0 20px 16px;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.t-alt b{color:var(--ink);font-weight:600}
.stamp{position:absolute;top:18px;right:18px;width:74px;height:74px;border:3px solid var(--seal);border-radius:12px;color:var(--seal-text);display:grid;place-items:center;transform:rotate(-11deg);opacity:0;pointer-events:none}
.stamp::before{content:"";position:absolute;inset:4px;border:1px solid var(--seal);border-radius:7px}
.stamp b{font:800 23px/1 var(--f-seal);letter-spacing:.1em;margin-top:-8px}
.stamp small{position:absolute;bottom:9px;font:600 10px/1 var(--f-body);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.ticket.is-confirmed .stamp{opacity:.92}
.ticket.just-stamped .stamp{animation:stamp .34s cubic-bezier(.2,.9,.3,1.25)}
@keyframes stamp{from{opacity:0;transform:rotate(-11deg) scale(1.7)}to{opacity:.92;transform:rotate(-11deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.ticket.just-stamped .stamp{animation:none}}
.notice-text{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical;line-height:1.6}
.xline{display:flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.xline span{padding:7px 10px;border-right:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.xline span:last-child{border-right:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through;background:transparent;border-style:dashed}
.stepper{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.stepper b{font:400 22px/1 var(--f-display);color:var(--ink);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.rate button[aria-pressed="true"]{border-color:var(--seal);color:var(--seal-text);background:var(--seal-soft)}
.rate.mini button{padding:1px 8px;font-size:12px;font-weight:500}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist .d{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12.5px}
.hist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 식당 목록 */
.lhead{display:flex;flex-direction:column;gap:10px}
.searchbox{width:100%;height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface)}
.fchips{display:flex;gap:4px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selrow select{height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 8px}
.pickbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;background:var(--seal-soft);color:var(--seal-text);font-weight:600;font-size:13px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ritem:hover{border-color:var(--line-2)}
.ritem.is-off{opacity:.65}
.ritem .mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.ritem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .sub{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .bd{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ritem .right{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hearts{color:var(--seal-text);font-weight:600}
.lcount{font-size:12.5px;color:var(--ink-3)}

/* 설정 */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form label,.form fieldset{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
.form fieldset{border:0;padding:0;margin:0;flex-direction:row;flex-wrap:wrap;gap:6px 14px}
.form legend{padding:0;margin-bottom:4px;width:100%}
.form .full{grid-column:1/-1}
.form input:not([type=checkbox]),.form select,.form textarea,.inline input{height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;background:var(--surface);font-weight:400;color:var(--ink);width:100%;min-width:0}
.form textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.55}
.form .ck,.ck{flex-direction:row;align-items:center;gap:6px;font-weight:500;color:var(--ink)}
.ck input{width:16px;height:16px;accent-color:var(--seal)}
.inp{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink-2)}
.inp input{max-width:90px}
.inline{display:flex;gap:8px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.about{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.locrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}

/* 지도 위 도구 */
.map-top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.map-top>*{pointer-events:auto}
.mchips{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);max-width:100%;scrollbar-width:none}
.mchips button{border:0;background:transparent;border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.mchips button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.mchips .tog{margin-left:3px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;padding-left:10px}
.mchips .tog[aria-pressed]{background:transparent;color:var(--ink-2)}
.tog::before{content:"";display:inline-block;width:11px;height:11px;border:1.5px solid currentColor;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tog[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.map-ctl{position:absolute;right:12px;bottom:34px;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11.5px;color:var(--ink-2);display:flex;gap:4px 12px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100% - 80px)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--pin-ink);background:var(--pin-bg);display:inline-block}
.lg.recent{border-color:var(--rest);background:var(--surface-2)}
.lg.off{border-style:dashed;opacity:.55}
.lg.pick{background:var(--seal);border-color:var(--seal)}
.lg-heart{color:var(--seal-text);font-size:12px}
.attrib{position:absolute;right:6px;bottom:4px;font-size:10.5px;color:var(--ink-3);background:var(--m-halo);padding:0 5px;border-radius:4px}
.detail{position:absolute;left:12px;top:62px;width:min(350px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.16);padding:16px;max-height:calc(100% - 130px);overflow:auto}
.detail .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;background:transparent;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-3)}
.d-cat{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500;font-size:13px;flex-wrap:wrap}
.d-name{margin:8px 0 0;font:400 25px/1.15 var(--f-display);padding-right:24px;overflow-wrap:anywhere}
.d-menu{margin-top:4px;color:var(--ink-2);font-size:13.5px}
.d-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.d-stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.d-stats b{font:400 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.d-stats span{font-size:11.5px;color:var(--ink-3)}
.d-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}

#map .s-rail{stroke:var(--m-rail);stroke-width:2px;opacity:.8}
#map .rc{stroke:var(--m-casing)}
#map .rc0,#map .rc1,#map .rc2{stroke:var(--m-major-casing)}

#map .rf0,#map .rf1,#map .rf2{stroke:var(--m-major)}
#map .rf0{stroke-width:var(--w0)} #map .rf1{stroke-width:var(--w1)} #map .rf2{stroke-width:var(--w2)} #map .rf3{stroke-width:var(--w3)}

#map .rt{stroke:var(--m-casing);stroke-width:var(--w3);opacity:.45}

/* ---------- 거리 계산(내장 도로망) ---------- */
const Geo = (() => {
  const U = MAPDATA.unit, NN = MAPDATA.nodes.length / 2;
  const X = new Float64Array(NN), Y = new Float64Array(NN);
  for (let i = 0; i < NN; i++) { X[i] = MAPDATA.nodes[2 * i] * U; Y[i] = MAPDATA.nodes[2 * i + 1] * U; }
  const adjW = Array.from({ length: NN }, () => []), adjC = Array.from({ length: NN }, () => []);
  const mW = new Uint8Array(NN), mC = new Uint8Array(NN);
  for (const w of MAPDATA.ways) {
    const cls = w[0], fl = w[1];
    const walk = cls !== 0 && !((fl & 2) && cls <= 5);
    const car = cls <= 5 && !(fl & 48);
    for (let i = 3; i < w.length - 1; i++) {
      const a = w[i], b = w[i + 1], d = Math.hypot(X[a] - X[b], Y[a] - Y[b]);
      if (walk) { adjW[a].push(b, d); adjW[b].push(a, d); mW[a] = mW[b] = 1; }
      if (car) { adjC[a].push(b, d); adjC[b].push(a, d); mC[a] = mC[b] = 1; }
    }
  }
  const OFFICE = (() => {
    const o = MAPDATA.office; if (!o) return { x: 0, y: 0 };
    let sx = 0, sy = 0, n = 0; for (let i = 0; i < o.length - 2; i += 2) { sx += o[i]; sy += o[i + 1]; n++; }
    return { x: sx / n * U, y: sy / n * U };
  })();
  function nearest(x, y, mask, k) {
    const best = [];
    for (let i = 0; i < NN; i++) {
      if (!mask[i]) continue;
      const d = Math.hypot(X[i] - x, Y[i] - y);
      if (best.length < k || d < best[best.length - 1][1]) { best.push([i, d]); best.sort((a, b) => a[1] - b[1]); if (best.length > k) best.pop(); }
    }
    return best;
  }
  function run(adj, mask) {
    const dist = new Float64Array(NN).fill(Infinity), prev = new Int32Array(NN).fill(-1);
    const hd = [], hn = [];
    const push = (d, n) => { let i = hd.length; hd.push(d); hn.push(n); while (i > 0) { const p = (i - 1) >> 1; if (hd[p] <= hd[i]) break; [hd[p], hd[i]] = [hd[i], hd[p]]; [hn[p], hn[i]] = [hn[i], hn[p]]; i = p; } };
    const pop = () => {
      const d = hd[0], n = hn[0], ld = hd.pop(), ln = hn.pop();
      if (hd.length) {
        hd[0] = ld; hn[0] = ln; let i = 0;
        for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < hd.length && hd[l] < hd[m]) m = l; if (r < hd.length && hd[r] < hd[m]) m = r; if (m === i) break; [hd[m], hd[i]] = [hd[i], hd[m]]; [hn[m], hn[i]] = [hn[i], hn[m]]; i = m; }
      }
      return [d, n];
    };
    for (const [i, d] of nearest(OFFICE.x, OFFICE.y, mask, 4)) if (d < 200) { dist[i] = d; prev[i] = -2; push(d, i); }
    while (hd.length) {
      const [d, u] = pop(); if (d > dist[u]) continue;
      const a = adj[u];
      for (let j = 0; j < a.length; j += 2) { const v = a[j], nd = d + a[j + 1]; if (nd < dist[v]) { dist[v] = nd; prev[v] = u; push(nd, v); } }
    }
    return { dist, prev };
  }
  const W = run(adjW, mW), C = run(adjC, mC);
  const cache = new Map();
  function via(T, mask, x, y) {
    let best = null;
    for (const [i, d] of nearest(x, y, mask, 4)) { const t = T.dist[i] + d; if (isFinite(t) && (!best || t < best.t)) best = { i, t, d }; }
    return best;
  }
  function measure(r) {
    if (!r || r.x == null) return { walk: null, walkMin: null, car: null };
    const key = r.x + ',' + r.y;
    let m = cache.get(key); if (m) return m;
    const straight = Math.hypot(r.x - OFFICE.x, r.y - OFFICE.y);
    const w = via(W, mW, r.x, r.y), c = via(C, mC, r.x, r.y);
    const walk = w && w.d < 250 ? w.t : straight * 1.35;
    const car = c && c.d < 400 ? c.t : straight * 1.35;
    m = { walk, walkMin: Math.max(1, Math.ceil(walk / WALK_M_PER_MIN)), car, wi: w ? w.i : -1, ci: c ? c.i : -1, straight };
    cache.set(key, m);
    return m;
  }
  function route(r) {
    const m = measure(r); const useCar = m.walkMin > 25;
    const T = useCar ? C : W; let u = useCar ? m.ci : m.wi;
    const pts = [[r.x, r.y]]; let guard = 0;
    while (u >= 0 && guard++ < NN) { pts.push([X[u], Y[u]]); u = T.prev[u]; }
    pts.push([OFFICE.x, OFFICE.y]);
    return pts.reverse();
  }
  return { measure, route, OFFICE, clear: () => cache.clear() };
})();

/* ---------- 집계 ---------- */
const byId = id => S.restaurants.find(r => r.id === id);
let statsCache = null;
function invalidate() { statsCache = null; }
function stats() {
  if (statsCache) return statsCache;
  const m = new Map();
  for (const r of S.restaurants) m.set(r.id, { last: null, days: null, good: 0, ok: 0, bad: 0, count: 0 });
  for (const v of S.visits) {
    const s = m.get(v.rid); if (!s || v.date > TODAY) continue;
    s.count++; if (v.rating === 'good') s.good++; else if (v.rating === 'bad') s.bad++; else if (v.rating === 'ok') s.ok++;
    if (!s.last || v.date > s.last) s.last = v.date;
  }
  for (const s of m.values()) if (s.last) s.days = dayDiff(s.last, TODAY);
  return (statsCache = m);
}
const lastVisitBefore = date => { let b = null; for (const v of S.visits) if (v.date < date && (!b || v.date > b.date)) b = v; return b; };
function catDays(cat) {
  let b = null;
  for (const v of S.visits) { if (v.date >= TODAY) continue; const r = byId(v.rid); if (r && r.cat === cat && (!b || v.date > b)) b = v.date; }
  return b ? dayDiff(b, TODAY) : null;
}
const presentMembers = () => { const ab = S.absent[TODAY] || []; return S.roster.filter(m => !ab.includes(m.id)); };

const headcount = () => S.roster.length ? presentMembers().length + (S.guests[TODAY] || 0) : (S.counts[TODAY] != null ? S.counts[TODAY] : lastCount());

}

/* ---------- 추천 ---------- */
function weightedPick(items) {
  const total = items.reduce((a, o) => a + o.w, 0);
  let x = Math.random() * total;
  for (const o of items) { x -= o.w; if (x <= 0) return o.r; }
  return items[items.length - 1].r;
}
function weight(r, s) {
  const days = s.days == null ? 30 : Math.min(s.days, 60);
  let w = 1 + days / 15 + s.good * 1.2 - s.bad * 1.5;
  const cd = catDays(r.cat); w += Math.min(cd == null ? 30 : cd, 30) / 15;
  const m = Geo.measure(r); w -= m.walkMin <= 25 ? m.walkMin / 12 : m.car / 1500;
  if (r.checkedAt) w += 0.3;
  return Math.pow(Math.max(0.15, w), 2);
}
function recommend(day) {
  const st = stats(), set = S.settings, head = headcount();
  const weekday = parseYmd(TODAY).getDay();
  const lv = lastVisitBefore(TODAY), lastCat = lv && byId(lv.rid) ? byId(lv.rid).cat : null;
  const lim = day.mode === 'near' ? { walk: set.nearLimit } : day.mode === 'car' ? { car: 3600 } : { walk: set.walkLimit };
  const base = S.restaurants.filter(r => r.x != null && !r.excluded && !set.excludedCats.includes(r.cat) && !r.closed.includes(weekday) && !(r.capacity && head > r.capacity));
  const within = (r, l) => { const m = Geo.measure(r); return l.walk ? m.walkMin <= l.walk : m.car <= l.car; };
  const tiers = [
    { cool: set.cooldown, same: !set.avoidSameCat, lim, note: '' },
    { cool: Math.min(set.cooldown, 5), same: !set.avoidSameCat, lim, note: `최근 ${set.cooldown}일 안에 안 간 곳이 없어 기준을 5일로 줄였습니다.` },
    { cool: Math.min(set.cooldown, 5), same: true, lim, note: '조건에 맞는 곳이 적어 같은 종류도 넣었습니다.' },
    { cool: 0, same: true, lim: lim.walk ? { walk: Math.max(lim.walk, set.walkLimit) + 8 } : lim, note: '가까운 곳을 최근에 모두 다녀와서 범위를 넓혔습니다.' },
    { cool: 0, same: true, lim: { car: 4200 }, note: '도보 범위에 고를 곳이 없어 차로 가는 곳까지 넓혔습니다.' },
  ];
  for (let attempt = 0; attempt < 2; attempt++) {
    const skip = attempt === 0 ? day.skip : [];
    for (const t of tiers) {
      const pool = base.filter(r => {
        if (skip.includes(r.id)) return false;
        const s = st.get(r.id); if (s.days != null && s.days < t.cool) return false;
        if (!t.same && lastCat && r.cat === lastCat) return false;
        return within(r, t.lim);
      });
      if (!pool.length) continue;
      const scored = pool.map(r => ({ r, w: weight(r, st.get(r.id)) }));
      const pick = weightedPick(scored);
      const rest = scored.filter(o => o.r.id !== pick.id);
      const other = rest.filter(o => o.r.cat !== pick.cat);
      const alt = other.length ? weightedPick(other) : rest.length ? weightedPick(rest) : null;
      return { pick: pick.id, alt: alt ? alt.id : null, note: t.note };
    }
    if (!day.skip.length) break;
  }
  return { pick: null, alt: null, note: '추천할 식당이 없습니다. 식당 목록에서 추천 제외 설정을 확인하세요.' };
}
function applyRec(day) { const r = recommend(day); day.pick = r.pick; day.alt = r.alt; day.note = r.note; }

/* ---------- 문구 ---------- */
function moveText(r) { if (r.x == null) return ''; const m = Geo.measure(r); return m.walkMin <= 25 ? `(도보 약 ${m.walkMin}분)` : `(차로 약 ${fmtKm(m.car)})`; }
function distText(r, long) {

  return m.walkMin <= 25 ? `도보 ${m.walkMin}분${long ? ' · ' + fmtKm(m.walk) : ''}` : `차로 ${fmtKm(m.car)}`;
}

}

  const names = people.join(', ') + (g ? (people.length ? ', ' : '') + '손님 ' + g + '명' : '');
  const map = { '날짜': TODAY, '식당': r.name, '종류': r.cat, '메뉴': r.menu || '', '인원': String(headcount()), '참석자': names };

function reasonsFor(r) {

    <div class="dlg-actions"><span class="grow"></span><button type="button" class="btn" data-action="closeModal">취소</button><button type="button" class="btn seal" data-action="doImport" id="doImport" disabled>가져오기</button></div>`,
    d => d.querySelector('#pasteBox').addEventListener('input', e => previewPaste(e.target.value)));
}
function previewPaste(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) { pasteState = null; $('#pastePreview').innerHTML = ''; $('#doImport').disabled = true; return; }
  const tab = lines.some(l => l.includes('\t'));
  const rows = lines.map(l => (tab ? l.split('\t') : l.split(/,|\s{2,}/)).map(c => c.trim()));
  const ncol = Math.max(...rows.map(r => r.length));
  const header = rows[0].some(c => HEAD_RULES.some(([, re]) => re.test(c)));
  const map = [];
  for (let i = 0; i < ncol; i++) {
    if (header) { const hit = HEAD_RULES.find(([, re]) => re.test(rows[0][i] || '')); map.push(hit && !map.includes(hit[0]) ? hit[0] : 'skip'); }
    else map.push(ORDER[i] || 'skip');
  }
  pasteState = { rows: header ? rows.slice(1) : rows, map, ncol };
  drawPreview();
}
function drawPreview() {
  const p = pasteState;
  $('#pastePreview').innerHTML = `<div class="ptable"><table><thead><tr>${p.map.map((f, i) => `<th><select data-col="${i}" aria-label="${i + 1}번째 칸">${FIELDS.map(([k, l]) => `<option value="${k}"${k === f ? ' selected' : ''}>${l}</option>`).join('')}</select></th>`).join('')}</tr></thead>
    <tbody>${p.rows.slice(0, 6).map(r => `<tr>${p.map.map((f, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted small" style="margin-top:8px">${p.rows.length}줄${p.rows.length > 6 ? ' 중 6줄만 보여 줍니다' : ''}. 각 칸 위에서 무엇인지 고를 수 있습니다.</p>`;
  $$('#pastePreview select').forEach(s => s.addEventListener('change', e => { pasteState.map[+e.target.dataset.col] = e.target.value; }));
  $('#doImport').disabled = !p.map.includes('name');
}
function doImport() {
  const p = pasteState; if (!p || !p.map.includes('name')) return;
  let added = 0, updated = 0;
  for (const row of p.rows) {
    const o = {}; p.map.forEach((f, i) => { if (f !== 'skip' && row[i]) o[f] = row[i]; });
    if (!o.name) continue;
    const cat = CATS.includes(o.cat) ? o.cat : guessCat(o.cat, o.name, o.menu) || '기타';
    const ex = S.restaurants.find(r => normName(r.name) === normName(o.name));
    if (ex) {
      for (const k of ['menu', 'price', 'tel', 'addr', 'note']) if (o[k]) ex[k] = o[k];
      if (o.cat) { ex.cat = cat; ex.guess = false; }
      updated++;
    } else {
      S.restaurants.push({ id: 'u' + Date.now().toString(36) + added, name: o.name, cat, menu: o.menu || '', price: o.price || '', tel: o.tel || '', addr: o.addr || '', x: null, y: null, loc: 'manual', src: '기존 식당 표(붙여넣기)', srcDate: TODAY, checkedAt: null, excluded: false, excludeNote: '', guess: !o.cat, reserve: false, capacity: null, closed: [], note: o.note || '' });
      added++;
    }
  }
  save(); closeModal();
  if (added) { LV.stat = 'noloc'; LV.cat = '전체'; }
  renderAll();
  toast(`새로 ${added}곳, 고친 곳 ${updated}곳.${added ? ' 새 식당은 목록에서 눌러 지도에 자리를 찍어 주세요.' : ''}`);
}

/* ---------- 인수인계 ---------- */
const exportText = () => JSON.stringify({ app: APP_ID, version: 1, exportedAt: TODAY, data: S }, null, 1);
function exportFile() {
  const name = `점심반장_인수인계_${TODAY}.json`, text = exportText();
  const done = msg => { S.lastBackup = TODAY; save(); renderSettings(); renderToday(); toast(msg); };
  // claude.ai에서 열었을 때: 플랫폼 저장 창을 거친다
  if (downloadsNS) {
    downloadsNS.save({ filename: name, data: text }).then(
      () => done('인수인계 파일을 저장했습니다.'),
      err => toast(err && err.code === 'declined' ? '저장을 취소했습니다.' : '여기서는 파일로 저장할 수 없습니다. ‘내용 복사’를 쓰세요.'));
    return;
  }
  if (EMBEDDED) { toast('이 화면에서는 파일 저장이 막혀 있습니다. ‘내용 복사’를 쓰세요.'); return; }
  // 내려받은 HTML 파일로 열었을 때: 브라우저 다운로드
  const blob = new Blob([text], { type: 'application/json' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
  done('인수인계 파일을 저장했습니다. 다운로드 폴더를 확인하세요.');
}
function askImport(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { toast('인수인계 파일을 읽지 못했습니다. 저장한 파일 내용 그대로인지 확인하세요.'); return; }
  const data = obj && obj.data ? obj.data : obj;
  if (!data || !Array.isArray(data.restaurants)) { toast('점심반장 인수인계 파일이 아닙니다.'); return; }
  openModal(`<h2>인수인계 파일 불러오기</h2><p>불러온 자료(식당 ${data.restaurants.length}곳 · 방문 기록 ${(data.visits || []).length}건 · 명단 ${(data.roster || []).length}명)로 지금 자료를 바꿉니다. 지금 자료는 사라집니다.</p>
    <div class="dlg-actions"><span class="grow"></span><button type="button" class="btn" data-action="closeModal">취소</button><button type="button" class="btn seal" id="confirmImport">바꾸기</button></div>`,
    d => d.querySelector('#confirmImport').addEventListener('click', () => { data.app = APP_ID; S = normalize(data); Geo.clear(); save(); closeModal(); App.select(null); renderAll(); toast('불러왔습니다.'); }));
}

/* ---------- 공통 UI ---------- */
function openModal(html, onMount) {
  const m = $('#modal');
  m.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  const d = m.firstElementChild, f = d.querySelector('input:not([type=hidden]),select,textarea,button');
  if (f) f.focus();
  if (onMount) onMount(d);
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; editing = null; pasteState = null; }
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function copyText(text, ok) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch (e) { /* 막힌 환경 */ } ta.remove();
    if (done) toast(ok);
    else openModal(`<h2>직접 복사하세요</h2><p class="muted small">이 화면에서는 자동 복사가 막혀 있습니다. 아래 내용이 선택되어 있으니 Ctrl+C를 누르세요.</p><textarea class="copybox" readonly rows="8">${esc(text)}</textarea><div class="dlg-actions"><span class="grow"></span><button type="button" class="btn seal" data-action="closeModal">닫기</button></div>`, d => { const t = d.querySelector('textarea'); t.focus(); t.select(); });
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(ok), fallback);
  else fallback();
}
function setTab(t) {
  App.tab = t;
  $('#app').dataset.tab = t;
  $$('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  const panel = t === 'map' ? 'today' : t;
  for (const v of ['today', 'list', 'settings']) $('#view-' + v).hidden = v !== panel;
  if (t === 'list') renderListItems();
  if (t === 'settings') renderSettings();
  requestAnimationFrame(MapView.update);
}
function renderAll() {
  invalidate();
  $('#todayLabel').textContent = fmtLong(TODAY);
  renderToday(); renderListItems();
  if (App.tab === 'settings') renderSettings();
  MapView.refreshPins();
  if (App.sel) { if (byId(App.sel)) { showDetail(App.sel); MapView.showRoute(byId(App.sel)); } else App.select(null); }
}
function confirmPick() {
  const day = getDay(); if (!day.pick) return;
  day.confirmedAt = nowHM();
  S.visits = S.visits.filter(v => v.date !== TODAY);
  S.visits.push({ date: TODAY, rid: day.pick, rating: null, people: presentMembers().map(m => m.name), guests: S.guests[TODAY] || 0, count: headcount() });
  save(); renderAll();
  const t = $('#ticket'); if (t) t.classList.add('just-stamped');
}
function syncTodayVisit() {
  const v = S.visits.find(x => x.date === TODAY); if (!v) return;
  v.people = presentMembers().map(m => m.name); v.guests = S.guests[TODAY] || 0; v.count = headcount();
}
function setPick(id, note) {
  const day = getDay(); if (day.confirmedAt) return;
  day.pick = id; day.alt = null; day.note = note || '';
  save(); renderAll();
}

const actions = {
  tab: el => setTab(el.dataset.tab),
  mode: el => { const day = getDay(); if (day.confirmedAt) return; day.mode = el.dataset.mode; day.skip = []; applyRec(day); save(); renderAll(); },
  reroll: () => { const day = getDay(); if (day.confirmedAt) return; for (const id of [day.pick, day.alt]) if (id && !day.skip.includes(id)) day.skip.push(id); applyRec(day); save(); renderAll(); },
  useAlt: () => { const day = getDay(); if (!day.alt || day.confirmedAt) return; [day.pick, day.alt] = [day.alt, day.pick]; day.note = ''; save(); renderAll(); },
  confirm: confirmPick,
  unconfirm: () => { const day = getDay(); day.confirmedAt = null; S.visits = S.visits.filter(v => v.date !== TODAY); save(); renderAll(); },
  pickManual: () => { LV.pick = true; LV.stat = 'all'; setTab('list'); toast('목록에서 오늘 갈 식당을 누르세요.'); },
  endPick: () => { LV.pick = false; renderListItems(); },
  pickFromList: el => { LV.pick = false; setPick(el.dataset.id, '직접 고른 식당입니다.'); setTab('today'); },
  pickThis: el => { setPick(el.dataset.id, '직접 고른 식당입니다.'); if (isNarrow()) setTab('today'); toast('오늘의 점심으로 정했습니다. 확정을 누르면 공지문이 나옵니다.'); },
  showOnMap: el => { if (isNarrow()) setTab('map'); requestAnimationFrame(() => App.select(el.dataset.id, true)); },
  openRow: el => { const r = byId(el.dataset.id); if (!r) return; if (r.x == null) { openEdit(r.id); return; } if (isNarrow()) setTab('map'); requestAnimationFrame(() => App.select(r.id, true)); },
  copyNotice: () => copyText($('#noticeText').value, '공지문을 복사했습니다. 메신저에 붙여 넣으세요.'),
  copyExcel: () => { const r = byId(getDay().pick); if (r) copyText(excelLine(r), '복사했습니다. 엑셀의 날짜 칸을 누르고 붙여 넣으세요.'); },
  copyTel: el => copyText(el.dataset.tel, '전화번호를 복사했습니다.'),
  rate: el => { const v = S.visits.find(x => x.date === el.dataset.date); if (!v) return; v.rating = v.rating === el.dataset.rating ? null : el.dataset.rating; save(); renderAll(); },
  togglePerson: el => { const ab = S.absent[TODAY] = S.absent[TODAY] || [], id = el.dataset.id, i = ab.indexOf(id); if (i >= 0) ab.splice(i, 1); else ab.push(id); syncTodayVisit(); save(); renderToday(); },
  guest: el => { S.guests[TODAY] = Math.max(0, (S.guests[TODAY] || 0) + +el.dataset.d); syncTodayVisit(); save(); renderToday(); },
  count: el => { S.counts[TODAY] = clamp(headcount() + +el.dataset.d, 1, 60); syncTodayVisit(); save(); renderToday(); },
  removePerson: el => { S.roster = S.roster.filter(m => m.id !== el.dataset.id); save(); renderSettings(); renderToday(); },
  listCat: el => { LV.cat = el.dataset.cat; renderListItems(); },
  mapCat: el => { MapView.F.cat = el.dataset.cat; MapView.refreshPins(); },
  mapOff: () => { MapView.F.off = !MapView.F.off; MapView.refreshPins(); },
  zoomIn: () => MapView.zoom(1 / 1.6), zoomOut: () => MapView.zoom(1.6), home: () => MapView.home(), fitAll: () => MapView.fitAll(),
  closeDetail: () => App.select(null),
  cancelPlace: () => MapView.stopPlace(),
  edit: el => openEdit(el.dataset.id),
  add: () => openEdit(null),
  verify: el => { const r = byId(el.dataset.id); if (!r) return; r.checkedAt = TODAY; save(); renderAll(); toast('확인 완료로 표시했습니다.'); },
  saveEdit: () => { const r = readForm(); if (!r) return; closeModal(); renderAll(); if (r.x == null) beginPlace(r); else { App.select(r.id); toast('저장했습니다.'); } },
  placeFromForm: () => { const r = readForm(); if (!r) return; closeModal(); renderAll(); beginPlace(r); },
  askDelete: el => { const r = byId(el.dataset.id); if (!r) return; openModal(`<h2>식당 지우기</h2><p>‘${esc(r.name)}’을(를) 목록에서 지웁니다. 지난 방문 기록은 남습니다.</p><div class="dlg-actions"><span class="grow"></span><button type="button" class="btn" data-action="closeModal">취소</button><button type="button" class="btn seal" data-action="doDelete" data-id="${r.id}">지우기</button></div>`); },
  doDelete: el => { const id = el.dataset.id; S.restaurants = S.restaurants.filter(r => r.id !== id); const day = getDay(); if (day.pick === id && !day.confirmedAt) applyRec(day); if (day.alt === id) day.alt = null; save(); closeModal(); App.select(null); renderAll(); toast('지웠습니다.'); },
  paste: openPaste,
  doImport,
  closeModal,
  exportFile,
  exportCopy: () => { S.lastBackup = TODAY; save(); renderSettings(); copyText(exportText(), '인수인계 내용을 복사했습니다. 메모장에 붙여 넣어 .json 파일로 저장하세요.'); },
  importPaste: () => openModal(`<h2>붙여 넣어 불러오기</h2><p class="muted small">인수인계 파일의 내용을 통째로 붙여 넣으세요.</p><textarea id="importBox" class="copybox" rows="8"></textarea><div class="dlg-actions"><span class="grow"></span><button type="button" class="btn" data-action="closeModal">취소</button><button type="button" class="btn seal" data-action="importFromBox">불러오기</button></div>`),
  importFromBox: () => { const t = $('#importBox').value; closeModal(); askImport(t); },
  askReset: () => openModal(`<h2>처음 상태로 되돌리기</h2><p>식당 목록·방문 기록·명단·설정을 모두 지우고 처음 받은 상태로 돌아갑니다. 먼저 인수인계 파일을 저장해 두는 것이 좋습니다.</p><div class="dlg-actions"><span class="grow"></span><button type="button" class="btn" data-action="closeModal">취소</button><button type="button" class="btn seal" data-action="doReset">모두 지우기</button></div>`),
  doReset: () => { S = normalize(defaultState()); applyRec(getDay()); Geo.clear(); save(); closeModal(); App.select(null); setTab('today'); renderAll(); toast('처음 상태로 되돌렸습니다.'); },
};
document.addEventListener('click', e => {
  const m = $('#modal'); if (e.target === m) { closeModal(); return; }
  const el = e.target.closest('[data-action]'); if (!el || el.closest('svg')) return;
  const fn = actions[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (!$('#placeHint').hidden) MapView.stopPlace(); else if (App.sel) App.select(null); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ritem')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const t = e.target, s = S.settings;
  if (t.dataset.set) {
    const k = t.dataset.set;
    if (t.type === 'checkbox') s[k] = t.checked;
    else if (t.type === 'number') { const n = parseInt(t.value, 10); if (!isNaN(n)) s[k] = clamp(n, +t.min || 0, +t.max || 999); t.value = s[k]; }
    else s[k] = t.value || (k === 'notice' ? DEFAULT_NOTICE : k === 'excel' ? DEFAULT_EXCEL : '');
    save(); renderToday(); MapView.refreshPins();
  } else if (t.dataset.excat) {
    const c = t.dataset.excat; s.excludedCats = t.checked ? [...new Set([...s.excludedCats, c])] : s.excludedCats.filter(x => x !== c);
    save(); renderToday();
  }
});
$$('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
window.matchMedia('(max-width: 899px)').addEventListener('change', () => setTab(App.tab === 'map' && !isNarrow() ? 'today' : App.tab));

if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(ns => { downloadsNS = ns; if (App.tab === 'settings') renderSettings(); }, () => {});
}
// 처음 열 때: 오늘 추천이 없으면 하나 뽑아 둔다
const day0 = getDay();
if (!day0.pick || !byId(day0.pick)) { applyRec(day0); save(); }
buildListShell();
renderAll();
})();
</script>

// 웹 주소로 열었을 때만: 홈 화면 설치·오프라인용 서비스워커
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.warn('서비스워커 등록 실패:', err)); });
}
